spring.application.name=distributed-order-platform

# Never lazy-load entities during view rendering; transactions end in the service layer.
spring.jpa.open-in-view=false

# Dev-only: the schema is generated from entities into in-memory H2. Replaced by versioned
# migrations before a real database is introduced (see docs/hld/architecture-decisions.md).
spring.jpa.hibernate.ddl-auto=create-drop
